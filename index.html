<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر مجاهد الرقمي - V15.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #020111, #191d35);
            color: white;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        h1 { color: #00d2ff; text-shadow: 0 0 10px #00d2ff; margin-bottom: 5px; }

        .balance-box {
            border: 1px solid #ffca28;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            background: rgba(255, 202, 40, 0.05);
        }

        #balance-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffca28;
            text-shadow: 0 0 10px #ffca28;
        }

        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .service-item {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
        }

        .service-item:hover {
            background: rgba(0, 210, 255, 0.2);
            transform: translateY(-5px);
            border-color: #00d2ff;
        }

        .service-item i { font-size: 24px; display: block; margin-bottom: 10px; }
        
        .footer-text { font-size: 12px; color: #888; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>متجر مجاهد</h1>
        <div style="font-size: 14px; color: #ccc;">
            إدارة: <strong>أبو لقمان</strong> <br>
            بإشراف: <strong>أبو القعقاع</strong>
        </div>

        <div class="balance-box">
            <div style="font-size: 13px;">الرصيد المتاح:</div>
            <div id="balance-value">جاري المزامنة...</div>
        </div>
    </div>

    <div class="services-grid">
        <div class="service-item">🎮<br>شحن PUBG</div>
        <div class="service-item">🔥<br>Free Fire</div>
        <div class="service-item">📱<br>أرقام وهمية</div>
        <div class="service-item">✈️<br>رصيد تلغرام</div>
        <div class="service-item">💎<br>خدمات تيك توك</div>
        <div class="service-item">💬<br>واتساب ذهبي</div>
        <div class="service-item">🛠️<br>خدمات تقنية</div>
    </div>

    <div class="footer-text">V15.0 - جميع الحقوق محفوظة لـ أبو لقمان</div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://matjar-mujahid-656dc-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // سحب الرصيد من المسار الذي ظهر في صورتك
        const balanceRef = database.ref('orders/554433/amount'); 
        balanceRef.on('value', (snapshot) => {
            const data = snapshot.val();
            document.getElementById('balance-value').innerText = (data ? data : "0") + " ل.س";
        });
    </script>
</body>
</html>
