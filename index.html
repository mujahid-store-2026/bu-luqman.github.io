<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر مجاهد - أبو لقمان</title>
    
    <link rel="manifest" href="manifest.json">
    
    <meta name="theme-color" content="#0a0a0a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0b1b27 0%, #050a0f 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            width: 85%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }
        h1 { color: #00d2ff; font-size: 26px; margin-bottom: 5px; text-shadow: 0 0 15px rgba(0, 210, 255, 0.5); }
        .owner { color: #888; font-size: 14px; margin-bottom: 25px; }
        .balance-box {
            background: rgba(0, 210, 255, 0.05);
            border: 1px dashed #00d2ff;
            border-radius: 15px;
            padding: 25px;
        }
        .balance-label { color: #aaa; font-size: 16px; }
        .balance-amount {
            font-size: 36px;
            font-weight: bold;
            color: #ffcc00;
            display: block;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>متجر مجاهد الرقمي</h1>
        <div class="owner">إدارة: <strong>أبو لقمان</strong></div>
        
        <div class="balance-box">
            <span class="balance-label">رصيدك المتوفر حالياً:</span>
            <span id="user-balance" class="balance-amount">جاري التحميل...</span>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
