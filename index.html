<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر مجاهد الرقمي</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 320px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1 {
            color: #00d2ff;
            text-shadow: 0 0 10px #00d2ff;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .admin-tag {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .balance-box {
            border: 2px dashed #00d2ff;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }

        #balance-value {
            font-size: 28px;
            font-weight: bold;
            color: #ffca28;
            text-shadow: 0 0 15px #ffca28;
        }

        .btn {
            background: rgba(0, 210, 255, 0.2);
            border: 1px solid #00d2ff;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #00d2ff;
            box-shadow: 0 0 20px #00d2ff;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>متجر مجاهد الرقمي</h1>
        <div class="admin-tag">
            إدارة: <strong>أبو لقمان</strong> <br>
            بإشراف: <strong>أبو القعقاع</strong>
        </div>

        <div class="balance-box">
            <div style="font-size: 14px;">إجمالي المبيعات (أحدث طلب):</div>
            <div id="balance-value">جاري التحميل...</div>
        </div>

        <button class="btn" onclick="location.reload()">تحديث البيانات</button>
    </div>

    <script>
        // إعدادات Firebase من الصور الخاصة بك
        const firebaseConfig = {
            databaseURL: "https://matjar-mujahid-656dc-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // جلب البيانات بناءً على هيكلية الصور (مسار orders)
        const ordersRef = database.ref('orders/554433/amount'); 
        
        ordersRef.on('value', (snapshot) => {
            const amount = snapshot.val();
            if (amount !== null) {
                document.getElementById('balance-value').innerText = amount + " ل.س";
            } else {
                document.getElementById('balance-value').innerText = "لا يوجد بيانات";
            }
        }, (error) => {
            document.getElementById('balance-value').innerText = "خطأ اتصال";
        });
    </script>

</body>
</html>
