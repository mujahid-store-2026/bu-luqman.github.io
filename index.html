<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر مجاهد | إدارة أبو لقمان</title>
    
    <style>
        :root {
            --primary-color: #00d2ff; /* اللون السماوي */
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1b2735 0%, #090a0f 100%);
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }

        /* بطاقة العنوان الرئيسية */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 210, 255, 0.2);
            margin-bottom: 30px;
        }

        .admin-name {
            color: var(--primary-color);
            font-size: 2.2rem;
            margin: 10px 0;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
            font-weight: bold;
        }

        .sub-title {
            letter-spacing: 2px;
            opacity: 0.8;
            font-size: 1rem;
        }

        /* شبكة المنتجات */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .product-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .product-item:hover {
            border-color: var(--primary-color);
            background: rgba(0, 210, 255, 0.08);
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-order {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-order:hover {
            filter: brightness(1.2);
            letter-spacing: 1px;
        }

        /* التذييل (الفوتر) */
        footer {
            margin-top: 50px;
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--glass-border);
            font-size: 0.9rem;
            color: #888;
        }

        .highlight {
            color: var(--primary-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <div class="sub-title">الإدارة العامة لمتجر مجاهد</div>
        <h1 class="admin-name">أبو لقمان</h1>
        <p>نقدم لكم أفضل المنتجات والخدمات البرمجية</p>
    </div>

    <div class="product-grid">
        <div class="product-item">
            <h3>منتج 1</h3>
            <p>سعر خاص</p>
            <button class="btn-order">شراء الآن</button>
        </div>

        <div class="product-item">
            <h3>منتج 2</h3>
            <p>عرض محدود</p>
            <button class="btn-order">شراء الآن</button>
        </div>

        <div class="product-item">
            <h3>منتج 3</h3>
            <p>الأكثر طلباً</p>
            <button class="btn-order">شراء الآن</button>
        </div>
    </div>

    <footer>
        <p>تم التطوير بواسطة <span class="highlight">أبو لقمان</span> &copy; 2024</p>
    </footer>
</div>

</body>
</html>
